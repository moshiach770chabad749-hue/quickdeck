<title>QuickDeck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a live replica of the hardware-style deck is the hero, with a theme switcher under it.
   The rest is quiet text: features, the ChatGPT theme flow, ideas, FAQ, download. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #15171f;
  --muted: #5d6273;
  --line: #dfe2ea;
  --accent: #2f55ff;
  --accent-ink: #ffffff;
  --key-top: #ffffff;
  --key-side: #c9cdd8;
  --code-bg: #15171f;
  --code-ink: #e6e8f0;
  --font-display: "Rubik", "Segoe UI", Arial, sans-serif;
  --font-body: "Heebo", "Segoe UI", Arial, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1016; --surface: #171923; --ink: #eceef5; --muted: #9a9fb3; --line: #272a38;
    --accent: #7b93ff; --accent-ink: #0f1016; --key-top: #2a2d3c; --key-side: #11131b; --code-bg: #0a0b10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1016; --surface: #171923; --ink: #eceef5; --muted: #9a9fb3; --line: #272a38;
  --accent: #7b93ff; --accent-ink: #0f1016; --key-top: #2a2d3c; --key-side: #11131b; --code-bg: #0a0b10; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; margin: 0; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* nav */
.nav { display: flex; align-items: center; gap: 16px; padding-block: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 21px; text-decoration: none; }
.mark { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 26px; height: 26px; }
.mark i { border-radius: 4px; }
.nav .spacer { flex: 1; }
.nav a.link { text-decoration: none; color: var(--muted); font-size: 15px; }
.nav a.link:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.lang button { border: 0; background: none; color: var(--muted); font: 600 13.5px var(--font-body); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.lang button.on { background: var(--ink); color: var(--bg); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font: 600 16px var(--font-body); border-radius: 12px; padding: 13px 22px; transition: transform .12s, box-shadow .12s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-sm { padding: 9px 16px; font-size: 14.5px; border-radius: 10px; }
@media (max-width: 720px) { .nav a.link { display: none; } }
@media (max-width: 420px) { .nav .btn-sm { display: none; } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 56px; align-items: center; padding-block: 36px 80px; }
@media (max-width: 960px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 16px 56px; } }
.eyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.eyebrow b { color: var(--accent); font-weight: 700; }
.hero h1 { font-size: clamp(38px, 5.4vw, 64px); font-weight: 800; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.lede { font-size: 19px; color: var(--muted); margin-top: 20px; max-width: 34em; }
.combo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 30px; direction: ltr; justify-content: flex-start; }
[dir="rtl"] .combo { justify-content: flex-end; }
.combo .plus { color: var(--muted); font-family: var(--font-mono); }
.combo .say { color: var(--muted); font-size: 15px; margin-inline-start: 6px; }
.key {
  font-family: var(--font-mono); font-weight: 700; font-size: 15px; color: var(--ink); direction: ltr;
  background: var(--key-top); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px 9px;
  box-shadow: 0 4px 0 var(--key-side), 0 6px 12px rgba(0,0,0,.08); transition: transform .08s, box-shadow .08s;
}
.key.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-side); color: var(--accent); }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; align-items: center; }

/* ===== demo: a hardware-style deck. Always dark, like the real app ===== */
.demo-shell { position: relative; }
.demo-shell::before { content: ""; position: absolute; inset: 8% -4% -6% 6%; border-radius: 40px; background: var(--dglow); filter: blur(70px); opacity: .35; z-index: 0; transition: background .4s; }
.demo {
  --dbody: linear-gradient(180deg, #2a2a33, #0f0f13); --dborder: rgba(255,255,255,.1); --dglow: #7c5cff; --dbezel: rgba(0,0,0,.5); --dbg: radial-gradient(120% 80% at 85% -10%, rgba(124,92,255,.28), transparent 60%);
  --lbl: #fff; --kbg: linear-gradient(160deg, #2c2822, #100f0d); --kborder: rgba(255,255,255,.08);
  position: relative; z-index: 1; color: #eef0f6; border-radius: 26px; padding: 16px; overflow: hidden; isolation: isolate;
  background: var(--dbody); border: 1px solid var(--dborder);
  box-shadow: 0 30px 70px rgba(10,12,30,.4), 0 0 26px -6px var(--dglow), inset 0 1px 0 rgba(255,255,255,.1);
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .18s;
}
.demo.closed { transform: scale(.94) translateY(10px); opacity: .25; }
.dbg { position: absolute; inset: 0; z-index: -1; background: var(--dbg); background-size: cover; transition: background .4s; overflow: hidden; }
.dbg::before, .dbg::after { content: ""; position: absolute; pointer-events: none; }
.leds { position: absolute; top: 7px; inset-inline-end: 22px; display: flex; gap: 5px; }
.leds i { width: 4px; height: 4px; border-radius: 50%; background: var(--dglow); box-shadow: 0 0 6px var(--dglow); }
.leds i:nth-child(2) { animation: led 2.6s infinite; }
.leds i:nth-child(3) { background: #3dff8b; box-shadow: 0 0 6px #3dff8b; }
@keyframes led { 50% { opacity: .2; } }
/* background effects */
.e-aurora .dbg::before { width: 75%; height: 85%; top: -25%; left: -15%; border-radius: 50%; filter: blur(40px); opacity: .6; background: radial-gradient(circle, #34f5c5, transparent 65%); animation: aur1 14s ease-in-out infinite alternate; }
.e-aurora .dbg::after { width: 75%; height: 85%; bottom: -30%; right: -15%; border-radius: 50%; filter: blur(40px); opacity: .55; background: radial-gradient(circle, #a855f7, transparent 65%); animation: aur2 17s ease-in-out infinite alternate; }
@keyframes aur1 { to { transform: translate(45%, 30%) scale(1.25); } }
@keyframes aur2 { to { transform: translate(-40%, -25%) scale(1.15); } }
.e-grid .dbg::before { left: -50%; right: -50%; bottom: -10%; height: 50%; background-image: linear-gradient(rgba(255,79,154,.7) 2px, transparent 2px), linear-gradient(90deg, rgba(255,79,154,.7) 2px, transparent 2px); background-size: 40px 40px; transform: perspective(240px) rotateX(62deg); transform-origin: bottom; animation: gridmove 1.6s linear infinite; opacity: .55; -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%); }
.e-grid .dbg::after { width: 46%; aspect-ratio: 1; left: 27%; top: 18%; border-radius: 50%; background: repeating-linear-gradient(transparent 0 70%, rgba(13,2,33,.85) 70% 76%), linear-gradient(#ffe66d, #ff2e88); opacity: .75; }
@keyframes gridmove { to { background-position: 0 40px; } }
.e-scan .dbg::before { inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px); }
.e-scan .dbg::after { left: 0; right: 0; height: 30%; background: linear-gradient(transparent, rgba(255,43,214,.14), transparent); animation: scan 6s linear infinite; }
@keyframes scan { from { top: -30%; } to { top: 100%; } }
.e-bubbles .dbg::before { inset: 0 0 -100% 0; background-image: radial-gradient(circle, rgba(255,255,255,.35) 0 3px, transparent 4px), radial-gradient(circle, rgba(255,255,255,.2) 0 6px, transparent 7px); background-size: 120px 160px, 200px 230px; background-position: 20px 0, 90px 40px; animation: rise 14s linear infinite; }
@keyframes rise { to { transform: translateY(-50%); } }
.e-stars .dbg::before { inset: -100% 0 0 0; background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #fff, transparent), radial-gradient(1.5px 1.5px at 160px 60px, #cfd8ff, transparent), radial-gradient(1px 1px at 230px 170px, #fff, transparent); background-size: 260px 200px; opacity: .8; animation: drift 50s linear infinite; }
@keyframes drift { to { transform: translateY(50%); } }

.d-top { display: flex; gap: 8px; }
.d-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 13px; background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 2px 6px rgba(0,0,0,.45); }
.d-search:focus-within { border-color: var(--dglow); }
.d-search svg { width: 18px; height: 18px; flex: none; stroke: #8f93a8; fill: none; stroke-width: 2; }
.d-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #eef0f6; font: 500 16px var(--font-body); }
.d-search input::placeholder { color: #7a7e94; }
.d-search kbd { font: 11px var(--font-mono); color: #8f93a8; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 2px 6px; direction: ltr; white-space: nowrap; }
@media (max-width: 480px) { .d-search kbd { display: none; } }
.d-icon { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 3px 0 rgba(0,0,0,.5); color: #8f93a8; flex: none; }
.d-tabs { display: flex; gap: 6px; margin: 12px 0; }
.d-tab { background: none; border: 1px solid transparent; color: #8f93a8; font: 13px var(--font-body); padding: 5px 13px; border-radius: 99px; cursor: pointer; }
.d-tab.on { background: rgba(255,255,255,.1); color: #eef0f6; border-color: rgba(255,255,255,.1); box-shadow: 0 0 12px -4px var(--dglow); }
.d-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 10px; background: var(--dbezel); border-radius: 20px; box-shadow: inset 0 3px 10px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06); }
@media (max-width: 520px) { .d-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; } .d-grid > :nth-child(n+13) { display: none; } }

/* keys: .tile = cap, .scr = screen inside */
.tile { --c: #3b3b52; aspect-ratio: 1 / .92; border: 0; padding: 0; border-radius: 14px; cursor: pointer; position: relative; font-family: var(--font-body); color: #fff; background: none; transition: transform .1s, filter .12s; isolation: isolate; }
.scr { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; z-index: 1;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, white 12%), color-mix(in srgb, var(--c) 72%, black 40%)); }
.scr::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: linear-gradient(165deg, rgba(255,255,255,.18), rgba(255,255,255,.04) 38%, transparent 40%); }
.tile .g { font-size: clamp(18px, 2.4vw, 26px); line-height: 1; position: relative; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.tile .l { font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.7); position: relative; z-index: 2; color: var(--lbl); }
.tile:not(.empty):hover { transform: translateY(-2px); filter: brightness(1.08); }
.tile.hit { transform: translateY(3px) scale(.97) !important; filter: brightness(1.4); }
.tile.empty { cursor: default; }
/* style: lcd + metal (cap with a screen inside) */
.s-lcd .tile, .s-metal .tile { background: linear-gradient(180deg, #34343d, #16161b 70%); box-shadow: 0 4px 0 #050507, 0 6px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--kborder); }
.s-metal .tile { background: repeating-linear-gradient(90deg, #3a3a40 0 1px, #2c2c31 1px 3px); box-shadow: 0 4px 0 #08080a, 0 6px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px var(--kborder); }
.s-lcd .scr { inset: 4px; border-radius: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,.45); }
.s-metal .scr { inset: 5px; border-radius: 9px; background: var(--kbg); box-shadow: inset 0 0 0 1px var(--kborder); }
.s-lcd .tile.hit, .s-metal .tile.hit { box-shadow: 0 1px 0 #050507; }
.s-lcd .tile.empty .scr, .s-metal .tile.empty .scr { background: radial-gradient(circle at 50% 40%, #121218, #050507); }
/* style: glass */
.s-glass .scr { background: color-mix(in srgb, var(--c) 40%, rgba(255,255,255,.05)); backdrop-filter: blur(10px) saturate(1.4); border: 1px solid rgba(255,255,255,.22); }
.s-glass .tile.empty .scr { background: rgba(255,255,255,.03); border: 1.5px dashed rgba(255,255,255,.12); backdrop-filter: none; }
.s-glass .tile.empty .scr::after { display: none; }
/* style: neon */
.s-neon .scr { background: rgba(6,4,14,.85); border: 1.5px solid color-mix(in srgb, var(--c) 90%, white); box-shadow: 0 0 9px color-mix(in srgb, var(--c) 70%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 40%, transparent); animation: pulse 2.4s ease-in-out infinite; animation-delay: var(--d); }
.s-neon .g { filter: drop-shadow(0 0 6px var(--c)); }
.s-neon .tile.empty .scr { border: 1.5px dashed rgba(255,255,255,.1); box-shadow: none; background: rgba(0,0,0,.3); animation: none; }
@keyframes pulse { 50% { box-shadow: 0 0 16px 2px color-mix(in srgb, var(--c) 85%, transparent), inset 0 0 16px color-mix(in srgb, var(--c) 55%, transparent); } }
/* theme-wide effects */
.f-shine .tile:not(.empty) .scr::before { content: ""; position: absolute; inset: -60%; z-index: 3; background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.4) 50%, transparent 58%); animation: shine 4.5s ease-in-out infinite; animation-delay: var(--d); }
@keyframes shine { 0%, 55% { transform: translateX(-55%); } 100% { transform: translateX(55%); } }
.f-float .tile:not(.empty) .g { animation: float 3s ease-in-out infinite; animation-delay: var(--d); }
@keyframes float { 50% { transform: translateY(-4px) scale(1.06); } }
.f-breathe .tile:not(.empty) .scr { animation: breathe 3.2s ease-in-out infinite; animation-delay: var(--d); }
@keyframes breathe { 50% { filter: brightness(1.3) saturate(1.2); } }
/* "live" keys: stand-ins for a GIF / video on a key */
.live-wave .scr { background: linear-gradient(120deg, #ff2e88, #7c5cff, #00c8ff, #ff2e88) !important; background-size: 300% 300% !important; animation: flow 5s ease infinite !important; }
@keyframes flow { 50% { background-position: 100% 50%; } }
.live-eq .scr { background: #08060f !important; }
.eq { display: flex; align-items: flex-end; gap: 3px; height: 42%; position: relative; z-index: 2; }
.eq i { width: 5px; border-radius: 2px; background: linear-gradient(#3dff8b, #00c8ff); animation: eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.15s; } .eq i:nth-child(5) { animation-delay: -.45s; }
@keyframes eq { from { height: 15%; } to { height: 100%; } }
.live-ring::before { content: ""; position: absolute; inset: -2px; border-radius: 16px; z-index: 0; background: conic-gradient(from var(--ang), #ff004c, #ffb800, #3dff6e, #00c8ff, #a64bff, #ff004c); animation: spin 3s linear infinite; }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --ang: 360deg; } }
.live-rec .g { animation: rec 1.2s steps(1) infinite; }
@keyframes rec { 50% { opacity: .25; } }

.d-results { display: flex; flex-direction: column; gap: 2px; min-height: 0; margin-top: 12px; background: rgba(0,0,0,.35); border-radius: 16px; padding: 6px; }
.d-res { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 11px; cursor: pointer; }
.d-res.sel { background: color-mix(in srgb, var(--dglow) 30%, transparent); }
.d-res .ri { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; flex: none; }
.d-res .rt { flex: 1; min-width: 0; }
.d-res .rn { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-res .rn mark { background: none; color: #b3c0ff; font-weight: 700; }
.d-res .rs { font: 11px var(--font-mono); color: #8f93a8; direction: ltr; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-res .tag { font-size: 11px; color: #8f93a8; border: 1px solid rgba(255,255,255,.14); padding: 1px 8px; border-radius: 99px; flex: none; }
.d-status { margin-top: 10px; font: 12px var(--font-mono); color: #8f93a8; text-align: center; min-height: 18px; }
.d-status b { color: #fff; font-weight: 700; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; position: relative; z-index: 1; }
.pick { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 5px 12px 5px 6px; font: 600 13.5px var(--font-body); cursor: pointer; }
.pick i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.pick.on { border-color: var(--ink); }
.try { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
.try button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* sections */
section.block { padding-block: 72px; border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-direction: column; gap: 12px; max-width: 40em; margin-bottom: 40px; }
.sec-head h2 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 800; }
.sec-head p { color: var(--muted); font-size: 18px; }
.new { display: inline-block; font: 700 12px var(--font-mono); color: var(--accent-ink); background: var(--accent); border-radius: 99px; padding: 2px 10px; letter-spacing: .04em; align-self: flex-start; }

.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 40px; }
@media (max-width: 860px) { .features { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .features { grid-template-columns: minmax(0, 1fr); } }
.feat { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.feat .sw { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.2); }
.feat .sw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.feat h3 { font-size: 20px; font-weight: 700; }
.feat p { color: var(--muted); font-size: 16px; }

/* themes + ChatGPT */
.make { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: start; }
@media (max-width: 900px) { .make { grid-template-columns: minmax(0, 1fr); } }
.flow { display: flex; flex-direction: column; gap: 18px; counter-reset: s; }
.flow li { list-style: none; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; }
.flow ol { padding: 0; margin: 0; display: flex; flex-direction: column; gap: 20px; }
.flow .n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 15px var(--font-mono); background: var(--surface); border: 1px solid var(--line); color: var(--accent); }
.flow h3 { font-size: 19px; }
.flow p { color: var(--muted); font-size: 16px; margin-top: 4px; }
.code { background: var(--code-bg); color: var(--code-ink); border-radius: 18px; padding: 20px 22px; font: 13.5px/1.7 var(--font-mono); direction: ltr; text-align: left; overflow-x: auto; white-space: pre; border: 1px solid var(--line); }
.code .k { color: #9fb0ff; } .code .s { color: #8fe3b0; } .code .c { color: #6b7088; }
.code-cap { font: 12.5px var(--font-mono); color: var(--muted); margin-top: 10px; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 860px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step .n { font: 700 14px var(--font-mono); color: var(--accent); }
.step h3 { font-size: 21px; }
.step p { color: var(--muted); font-size: 16px; }
.step .keys { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; direction: ltr; }
.step .keys .key { font-size: 13px; padding: 5px 10px 6px; }

.ideas-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .ideas-wrap { grid-template-columns: minmax(0, 1fr); } }
.cat-list { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) { .cat-list { flex-direction: row; flex-wrap: wrap; } }
.cat { text-align: start; background: none; border: 1.5px solid transparent; border-radius: 12px; padding: 11px 16px; font: 600 16px var(--font-body); color: var(--muted); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.cat span.c { font: 13px var(--font-mono); }
.cat:hover { color: var(--ink); }
.cat.on { background: var(--surface); border-color: var(--line); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px 7px 8px; font-size: 15px; }
[dir="rtl"] .chip { padding: 7px 8px 7px 14px; }
.chip i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 15px; }

.faq { display: flex; flex-direction: column; max-width: 800px; }
.faq details { border-bottom: 1px solid var(--line); padding-block: 18px; }
.faq summary { cursor: pointer; font: 600 18px var(--font-display); list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font: 400 24px var(--font-mono); color: var(--muted); line-height: 1; transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { color: var(--muted); margin-top: 10px; max-width: 62ch; }

.final { text-align: center; padding-block: 90px; border-top: 1px solid var(--line); }
.final .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.final h2 { font-size: clamp(30px, 4.2vw, 48px); font-weight: 800; }
.final p { color: var(--muted); font-size: 18px; }
.specs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; font: 13.5px var(--font-mono); color: var(--muted); margin-top: 6px; }
footer { border-top: 1px solid var(--line); padding-block: 26px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

const CODE = `{
  "name": "Lava",
  "accent": "#ff6a00",
  "device": { "glow": "#ff6a00" },
  "background": {
    "value": "radial-gradient(#ff3d00, #1a0500)",
    "effect": "fireflies"
  },
  "keys": {
    "style": "neon",
    "effect": "pulse",
    "press": "ripple"
  }
}`;
// tiny JSON highlighter: keys and string values get their own color
function codeNodes() {
  const out = []; const re = /"[^"]*"(\s*:)?/g; let last = 0, m, i = 0;
  while ((m = re.exec(CODE))) {
    out.push(CODE.slice(last, m.index));
    const isKey = !!m[1];
    const word = isKey ? m[0].slice(0, m[0].length - m[1].length) : m[0];
    out.push(html`<span key=${i++} class=${isKey ? 'k' : 's'}>${word}</span>`);
    if (isKey) out.push(m[1]);
    last = re.lastIndex;
  }
  out.push(CODE.slice(last));
  return out;
}

function score(name, q) {
  const n = name.toLowerCase(); q = q.toLowerCase();
  if (n.startsWith(q)) return 80;
  if (n.split(/\s+/).some(w => w.startsWith(q))) return 60;
  if (n.includes(q)) return 40;
  let j = 0; for (const c of n) if (c === q[j]) j++;
  return j === q.length ? 10 : 0;
}
const isDomain = (q) => /^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(q);

function Hl({ text, q }) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (!q || i < 0) return text;
  return html`${text.slice(0, i)}<mark>${text.slice(i, i + q.length)}</mark>${text.slice(i + q.length)}`;
}

function Key({ t, i, hit, onPress, L }) {
  if (!t) return html`<div class="tile empty" aria-hidden="true"><span class="scr"></span></div>`;
  const [label, glyph, color, live] = t;
  return html`<button class=${'tile' + (live ? ' live-' + live : '') + (hit ? ' hit' : '')} style=${{ '--c': color, '--d': (-(i * .37) % 4).toFixed(2) + 's' }} onClick=${onPress}>
    <span class="scr">
      ${live === 'eq' ? html`<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>` : html`<span class="g">${glyph}</span>`}
      <span class="l">${L(label)}</span>
    </span>
  </button>`;
}

function Demo({ open, inputRef, L, themeId }) {
  const [page, setPage] = useState('main');
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const [hit, setHit] = useState(-1);
  const [status, setStatus] = useState(null);
  const th = THEMES.find(x => x.id === themeId) || THEMES[0];

  const results = useMemo(() => {
    const s = q.trim(); if (!s) return [];
    const out = [];
    if (isDomain(s)) out.push({ name: s, sub: 'https://' + s.replace(/^https?:\/\//, ''), g: '🌐', c: '#3b82f6', tag: L(T.tSite) });
    const tiles = Object.values(TILES).flat().filter(Boolean).map(x => ({ name: L(x[0]), g: x[1] || '🎧', c: x[2], sub: L(T.onDeck), tag: L(T.tKey), s: score(L(x[0]), s) })).filter(x => x.s);
    const apps = APPS.map(a => ({ name: a[0], g: a[1], c: a[2], sub: a[3], tag: L(T.tApp), s: score(a[0], s) })).filter(x => x.s);
    const seen = new Set();
    [...tiles, ...apps].sort((a, b) => b.s - a.s).forEach(r => { if (!seen.has(r.name)) { seen.add(r.name); out.push(r); } });
    out.splice(6);
    out.push({ name: L(T.google).replace('{q}', s), sub: 'google.com', g: '🔍', c: '#475569', tag: L(T.tSearch) });
    return out;
  }, [q, L]);

  useEffect(() => setSel(0), [q]);

  const launch = (name) => {
    setStatus(name);
    clearTimeout(launch.t); launch.t = setTimeout(() => setStatus(null), 1800);
  };
  const press = (i, t) => { setHit(i); setTimeout(() => setHit(-1), 180); launch(L(t[0])); };

  const onKey = (e) => {
    if (!q) return;
    if (e.key === 'ArrowDown') { setSel(s => Math.min(results.length - 1, s + 1)); e.preventDefault(); }
    if (e.key === 'ArrowUp') { setSel(s => Math.max(0, s - 1)); e.preventDefault(); }
    if (e.key === 'Enter' && results[sel]) { launch(results[sel].name); setQ(''); }
    if (e.key === 'Escape') setQ('');
  };

  return html`
    <div class=${['demo', th.style, th.fx, th.e, open ? '' : 'closed'].filter(Boolean).join(' ')} style=${th.v} role="region" aria-label=${L(T.demoLabel)}>
      <div class="dbg" aria-hidden="true"></div>
      <div class="leds" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="d-top">
        <label class="d-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="demo-q" ref=${inputRef} value=${q} onInput=${e => setQ(e.target.value)} onKeyDown=${onKey}
            placeholder=${L(T.ph)} autocomplete="off" spellcheck="false" aria-label=${L(T.searchLabel)} />
          <kbd>Ctrl+Shift+Space</kbd>
        </label>
        <div class="d-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-1-.9-1.4-.9-2.4 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.4-9-7.4z"/></svg></div>
      </div>
      ${q.trim() ? html`
        <div class="d-results">
          ${results.map((r, i) => html`
            <div key=${r.name + i} class=${'d-res' + (i === sel ? ' sel' : '')} onMouseEnter=${() => setSel(i)} onClick=${() => { launch(r.name); setQ(''); }}>
              <span class="ri" style=${{ background: r.c }}>${r.g}</span>
              <span class="rt"><div class="rn"><${Hl} text=${r.name} q=${q.trim()} /></div><div class="rs">${r.sub}</div></span>
              <span class="tag">${r.tag}</span>
            </div>`)}
        </div>` : html`
        <div>
          <div class="d-tabs" role="tablist">
            ${Object.keys(TILES).map(p => html`<button key=${p} role="tab" aria-selected=${p === page} class=${'d-tab' + (p === page ? ' on' : '')} onClick=${() => setPage(p)}>${L(PAGES[p])}</button>`)}
          </div>
          <div class="d-grid">
            ${TILES[page].map((t, i) => html`<${Key} key=${page + i} t=${t} i=${i} hit=${hit === i} L=${L} onPress=${() => press(i, t)} />`)}
          </div>
        </div>`}
      <div class="d-status" aria-live="polite">${status ? html`${L(T.opened)} <b>${status}</b>` : L(T.idle)}</div>
    </div>`;
}

function readLang() {
  try { const u = new URLSearchParams(location.search).get('lang'); if (u === 'he' || u === 'en') return u; } catch (e) {}
  try { const s = localStorage.getItem('qd-lang'); if (s === 'he' || s === 'en') return s; } catch (e) {}
  return 'en';
}
